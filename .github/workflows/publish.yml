name: publish

# Triggered on semver tag pushes or an explicit recovery dispatch for an
# existing tag. Publishes to npm, Official MCP Registry, and the Docker MCP
# catalog. OIDC verifies our namespace.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v0.2.5)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          test "${RELEASE_TAG}" = "v${package_version}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify publish contents
        run: npm pack --dry-run

  npm-publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Verify token-free OIDC publishing context
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
      - name: Publish immutable npm version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} is already published"
            exit 0
          fi
          if npm publish --access public; then
            exit 0
          fi
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} was published concurrently"
            exit 0
          fi
          exit 1

  mcp-registry-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install mcp-publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Authenticate to Official MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to Official MCP Registry
        run: ./mcp-publisher publish

  docker-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/pilot-protocol/pilot-mcp:latest
            ghcr.io/pilot-protocol/pilot-mcp:${{ inputs.tag || github.ref_name }}
          provenance: true
          sbom: true
