name: publish

# Triggered on semver tag pushes or an explicit recovery dispatch for an
# existing tag. Publishes to npm, Official MCP Registry, and the Docker MCP
# catalog. OIDC verifies our namespace.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v0.2.5)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          test "${RELEASE_TAG}" = "v${package_version}"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify publish contents
        run: npm pack --dry-run

  npm-publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Publish immutable npm version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} is already published"
            exit 0
          fi
          if npm publish --access public; then
            exit 0
          fi
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} was published concurrently"
            exit 0
          fi
          exit 1

  mcp-registry-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install mcp-publisher
        run: npm install -g @modelcontextprotocol/mcp-publisher
      - name: Publish to Official MCP Registry
        run: mcp-publisher publish server.json
        env:
          # OIDC token verifies the io.github.<user>/* namespace.
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}

  docker-publish:
    runs-on: ubuntu-latest
    needs: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/teoslayer/pilot-mcp:latest
            ghcr.io/teoslayer/pilot-mcp:${{ inputs.tag || github.ref_name }}
          provenance: true
          sbom: true
