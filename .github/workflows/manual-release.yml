name: manual npm release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on:
      - self-hosted
      - pilot-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify publish contents
        run: npm pack --dry-run
      - name: Publish unless this immutable version already exists
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} is already published"
            exit 0
          fi
          if npm publish --access public; then
            exit 0
          fi
          published="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published}" == "${package_version}" ]]; then
            echo "${package_name}@${package_version} was published concurrently"
            exit 0
          fi
          exit 1
